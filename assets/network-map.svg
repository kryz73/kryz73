<svg width="440" height="320" viewBox="0 0 440 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dot Grid Pattern -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6" />
    </pattern>

    <!-- Node Gradient & Filters -->
    <linearGradient id="node-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="center-node-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06221f" />
      <stop offset="100%" stop-color="#041513" />
    </linearGradient>

    <!-- Glowing Junction Filter -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.8" />
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ff9d" flood-opacity="0.8" />
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="440" height="320" rx="10" fill="#070b14" />
  <rect width="440" height="320" rx="10" fill="url(#dot-grid)" />
  <rect width="440" height="320" rx="10" stroke="#16233b" stroke-width="1.5" fill="none" />

  <!-- Connecting Bus Lines (Orthogonal Circuit Paths) -->
  <g stroke="#1e3252" stroke-width="1.5" stroke-dasharray="3 3">
    <!-- APIs to Systems -->
    <path d="M105 85 L145 85 L145 155 L220 155" />
    <!-- Clients to Systems -->
    <path d="M335 85 L295 85 L295 155 L220 155" />
    <!-- Services to Systems -->
    <path d="M115 170 L170 170" />
    <!-- Systems to Data -->
    <path d="M270 170 L325 170" />
    <!-- Infrastructure to Systems -->
    <path d="M135 255 L220 255 L220 190" />
    <!-- ML/Analytics to Systems -->
    <path d="M305 255 L220 255" />
    <!-- Data to ML/Analytics -->
    <path d="M365 190 L365 240" />
    <!-- Top Bus Line Cross Link -->
    <path d="M145 85 L145 50 L295 50 L295 85" />
  </g>

  <!-- Colored Data Packets / Junction Nodes -->
  <!-- Top Link Packet -->
  <circle cx="220" cy="50" r="3.5" fill="#00f0ff" filter="url(#glow-cyan)" />
  <!-- APIs to Systems Corner -->
  <rect x="142" y="82" width="6" height="6" fill="#00ff9d" filter="url(#glow-green)" />
  <!-- Clients to Systems Corner -->
  <rect x="292" y="82" width="6" height="6" fill="#a855f7" filter="url(#glow-purple)" />
  <!-- Services-Systems Midpoint -->
  <circle cx="145" cy="155" r="3.5" fill="#00f0ff" filter="url(#glow-cyan)" />
  <!-- Systems-Data Midpoint -->
  <circle cx="295" cy="155" r="3.5" fill="#00ff9d" filter="url(#glow-green)" />
  <!-- Infrastructure Bus Junction -->
  <rect x="217" y="225" width="6" height="6" fill="#a855f7" filter="url(#glow-purple)" />
  <!-- Data to Analytics Bus -->
  <circle cx="365" cy="215" r="3.5" fill="#00f0ff" filter="url(#glow-cyan)" />

  <!-- Node Component 1: APIs (Top Left) -->
  <g transform="translate(35, 60)">
    <rect width="90" height="40" rx="6" fill="url(#node-bg)" stroke="#1e3252" stroke-width="1" />
    <path d="M18 16 H24 V24 H18 Z M16 14 H26 V26 H16 Z" fill="#94a3b8" />
    <text x="32" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#cbd5e1">APIs</text>
  </g>

  <!-- Node Component 2: Clients (Top Right) -->
  <g transform="translate(315, 60)">
    <rect width="90" height="40" rx="6" fill="url(#node-bg)" stroke="#1e3252" stroke-width="1" />
    <circle cx="20" cy="17" r="4" stroke="#94a3b8" stroke-width="1.2" fill="none" />
    <path d="M14 26 C14 22 26 22 26 26" stroke="#94a3b8" stroke-width="1.2" fill="none" />
    <text x="32" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#cbd5e1">Clients</text>
  </g>

  <!-- Node Component 3: Services (Mid Left) -->
  <g transform="translate(25, 150)">
    <rect width="90" height="40" rx="6" fill="url(#node-bg)" stroke="#1e3252" stroke-width="1" />
    <path d="M15 16 L22 13 L29 16 L22 19 Z M15 20 L22 23 L29 20 M15 24 L22 27 L29 24" stroke="#94a3b8" stroke-width="1.2" fill="none" />
    <text x="34" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#cbd5e1">Services</text>
  </g>

  <!-- Node Component 4: SYSTEMS (Center Hub - Green Accent) -->
  <g transform="translate(170, 150)">
    <rect width="100" height="40" rx="6" fill="url(#center-node-bg)" stroke="#00ff9d" stroke-width="1.5" />
    <!-- Server Stack Icon -->
    <rect x="15" y="15" width="12" height="3" rx="1" fill="#00ff9d" />
    <rect x="15" y="20" width="12" height="3" rx="1" fill="#00ff9d" opacity="0.7" />
    <rect x="15" y="25" width="12" height="3" rx="1" fill="#00ff9d" opacity="0.4" />
    <text x="34" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#00ff9d">Systems</text>
  </g>

  <!-- Node Component 5: Data (Mid Right) -->
  <g transform="translate(325, 150)">
    <rect width="90" height="40" rx="6" fill="url(#node-bg)" stroke="#1e3252" stroke-width="1" />
    <!-- Cylinder Database Icon -->
    <ellipse cx="21" cy="16" rx="6" ry="2.5" stroke="#94a3b8" stroke-width="1.2" fill="none" />
    <path d="M15 16 V24 C15 25.5 27 25.5 27 24 V16" stroke="#94a3b8" stroke-width="1.2" fill="none" />
    <text x="34" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#cbd5e1">Data</text>
  </g>

  <!-- Node Component 6: Infrastructure (Bottom Left) -->
  <g transform="translate(35, 235)">
    <rect width="120" height="40" rx="6" fill="url(#node-bg)" stroke="#1e3252" stroke-width="1" />
    <path d="M17 17 L23 13 L29 17 L23 21 Z M17 17 V24 L23 27 V21 M29 17 V24 L23 27" stroke="#94a3b8" stroke-width="1.2" fill="none" />
    <text x="35" y="24" font-family="monospace" font-size="10.5" font-weight="bold" fill="#cbd5e1">Infrastructure</text>
  </g>

  <!-- Node Component 7: ML / Analytics (Bottom Right) -->
  <g transform="translate(285, 235)">
    <rect width="125" height="40" rx="6" fill="url(#node-bg)" stroke="#1e3252" stroke-width="1" />
    <!-- Chart Bars Icon -->
    <path d="M16 26 V21 M21 26 V16 M26 26 V18" stroke="#94a3b8" stroke-width="1.5" />
    <text x="34" y="24" font-family="monospace" font-size="10.5" font-weight="bold" fill="#cbd5e1">ML / Analytics</text>
  </g>
</svg>